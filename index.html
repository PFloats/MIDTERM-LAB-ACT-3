<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in or Sign up — Campus Learning Management</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">

    <div class="brand">Campus Learning Management</div>

    <ul class="nav nav-tabs nav-fill mb-4" id="authTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="login-tab" data-bs-toggle="tab"
                data-bs-target="#login-pane" type="button" role="tab">
          Log In
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="signup-tab" data-bs-toggle="tab"
                data-bs-target="#signup-pane" type="button" role="tab">
          Sign Up
        </button>
      </li>
    </ul>

    <div class="tab-content">

      <!-- ---------------- LOGIN FORM ---------------- -->
      <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
        <form action="landing.html">
          <div class="mb-3">
            <label for="loginId" class="form-label">Email address or username</label>
            <input type="text" class="form-control" id="loginId" placeholder="Enter email or username" required>
          </div>

          <div class="mb-3">
            <label for="loginPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" required>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>

          <button type="submit" class="btn btn-primary w-100">Log In</button>
        </form>

        <p class="text-center mt-3 mb-0">
          Don't have an account?
          <a href="#" onclick="document.getElementById('signup-tab').click(); return false;">Sign up here</a>
        </p>
      </div>

      <!-- ---------------- SIGN UP FORM ---------------- -->
      <div class="tab-pane fade" id="signup-pane" role="tabpanel">
        <form action="landing.html">
          <div class="row">
            <div class="col-sm-6 mb-3">
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" class="form-control" id="firstName" placeholder="First name" required>
            </div>
            <div class="col-sm-6 mb-3">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" class="form-control" id="lastName" placeholder="Last name" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="gender" class="form-label">Gender</label>
            <select class="form-select" id="gender" required>
              <option value="" selected disabled>Select gender</option>
              <option>Female</option>
              <option>Male</option>
              <option>Prefer not to say</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="signupEmail" class="form-label">Email address</label>
            <input type="email" class="form-control" id="signupEmail" placeholder="Enter email" required>
          </div>

          <div class="row">
            <div class="col-sm-6 mb-3">
              <label for="signupPassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="signupPassword" placeholder="Password" required>
            </div>
            <div class="col-sm-6 mb-3">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm password" required>
            </div>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="agreeTerms" required>
            <label class="form-check-label" for="agreeTerms">
              I agree to the Terms and Conditions
            </label>
          </div>

          <button type="submit" class="btn btn-primary w-100">Sign Up</button>
        </form>

        <p class="text-center mt-3 mb-0">
          Already have an account?
          <a href="#" onclick="document.getElementById('login-tab').click(); return false;">Log in here</a>
        </p>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
